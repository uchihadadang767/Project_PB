<!-- Inline Script for Reactive Kiosk Micro-Interactions -->
<script>
    (function initKioskLiveCamera() {
      let count = 3;
      let intervalId = null;
      let flashActive = true;
      const countEl = document.getElementById('countdown-val');
      const circleEl = document.getElementById('svg-progress-circle');
      const shutterBtn = document.getElementById('btn-shutter');
      const flashBtn = document.getElementById('btn-flash');
      const flashIcon = document.getElementById('flash-icon');
      const flashState = document.getElementById('flash-state');
      const flashOverlay = document.getElementById('flash-overlay');

      function triggerFlash() {
        if (!flashActive) return;
        flashOverlay.classList.remove('opacity-0');
        flashOverlay.classList.add('opacity-100');
        setTimeout(() => {
          flashOverlay.classList.remove('opacity-100');
          flashOverlay.classList.add('opacity-0');
        }, 120);
      }

      function startCountdown() {
        clearInterval(intervalId);
        count = 3;
        countEl.textContent = count;
        circleEl.style.strokeDashoffset = '69';

        intervalId = setInterval(() => {
          count--;
          if (count > 0) {
            countEl.textContent = count;
            // Adjust circle dashoffset (276 / 3 per sec)
            const offsets = { 2: '138', 1: '207' };
            circleEl.style.strokeDashoffset = offsets[count] || '0';
          } else if (count === 0) {
            countEl.textContent = '★';
            circleEl.style.strokeDashoffset = '276';
            triggerFlash();
          } else {
            clearInterval(intervalId);
            setTimeout(() => {
              count = 3;
              countEl.textContent = count;
              circleEl.style.strokeDashoffset = '69';
            }, 1200);
          }
        }, 1000);
      }

      shutterBtn.addEventListener('click', () => {
        startCountdown();
      });

      flashBtn.addEventListener('click', () => {
        flashActive = !flashActive;
        if (flashActive) {
          flashIcon.textContent = 'flash_on';
          flashIcon.classList.remove('text-outline');
          flashIcon.classList.add('text-secondary');
          flashState.textContent = 'ON (AUTO)';
        } else {
          flashIcon.textContent = 'flash_off';
          flashIcon.classList.remove('text-secondary');
          flashIcon.classList.add('text-outline');
          flashState.textContent = 'DISABLED';
        }
      });
    })();
  </script>
